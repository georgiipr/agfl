[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agfl"
version = "0.3.0"
description = "Reproducible AGFL and attention comparisons for EEG and ECG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5,<3",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "scikit-learn>=1.4,<2",
    "mne>=1.6,<2",
    "wfdb>=4.1,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
plots = ["matplotlib>=3.8,<4"]
umap = ["umap-learn>=0.5,<1"]

[project.scripts]
agfl = "agfl.cli:main"

[tool.setuptools.packages.find]
include = ["agfl*"]

[tool.setuptools.package-data]
"agfl.presets" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_data: requires the physiological recordings on the target machine"]
